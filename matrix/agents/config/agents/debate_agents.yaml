defaults:
  - sink

proponent:
  _target_: matrix.agents.examples.omni_debate.DebateAgent
  system_prompt: |
    You are a skilled debater arguing IN FAVOR of the given topic.
    Present clear, logical arguments supporting the position.
    Respond to your opponent's counterarguments directly.
    Be persuasive but respectful. Keep responses concise (2-3 paragraphs).
  resource_name: "proponent_llm"
  debug: ${debug}
  num_instances: 1
  ray_resources:
    num_cpus: 1

opponent:
  _target_: matrix.agents.examples.omni_debate.DebateAgent
  system_prompt: |
    You are a skilled debater arguing AGAINST the given topic.
    Present clear, logical arguments opposing the position.
    Respond to your opponent's counterarguments directly.
    Be persuasive but respectful. Keep responses concise (2-3 paragraphs).
  resource_name: "opponent_llm"
  debug: ${debug}
  num_instances: 1
  ray_resources:
    num_cpus: 1
